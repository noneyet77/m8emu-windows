# Builds m8emu for Windows (one .exe) and macOS (a .dmg holding m8emu.app)
# and publishes both on one GitHub release, v<VERSION>.
#
# Runs when a commit that changes the VERSION file lands on main, or by hand
# from the Actions tab ("Run workflow"). The M8 Headless firmware is never
# part of either download: each app asks for the user's own .hex on first run.
name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Build
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
      - name: Package
        run: |
          mkdir -p dist
          strip -o "dist/m8emu-${{ needs.version.outputs.version }}-windows-x64.exe" build/windows-release/m8emu.exe
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Build
        # macos-dev skips profile-guided optimization: it only speeds up the
        # native engine, which the app builds on the user's Mac anyway, and it
        # would multiply the (10x-billed) macOS runner minutes.
        run: |
          cmake --preset macos-dev
          cmake --build --preset macos-dev
      - name: Package
        run: |
          mkdir -p dist
          sh scripts/package-macos-dmg.sh build/macos-dev/m8emu.app \
            "dist/m8emu-${{ needs.version.outputs.version }}-macos-arm64.dmg" \
            "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: m8emu ${{ needs.version.outputs.version }} for Windows and macOS
          body_path: docs/release-notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.dmg
